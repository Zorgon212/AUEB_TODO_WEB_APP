services:
  # run on mysql 8.4 so I suggest the same to be done
  # even tough it would probably work with different versions too
  # alter the enviroment url, username and password bellow in order to match
  # the local mysql db

  backend:
    build: ./backend
    environment:


      ###################
      ##Παραμετροποίηση##
      ##Εδώ##############
      ###################
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/todo_mysql_tasos"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "P@ssw0rd"
      ##################
      ##################
      ##################

    # Docker Desktop (Windows/Mac) resolves host.docker.internal automatically;
    # plain Docker Engine (Linux, WSL included) needs this mapping to do the same.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    # uncomment to reach the API directly (carefull! it bypasses nginx)
    # ports:
    #   - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - backend
      - frontend
