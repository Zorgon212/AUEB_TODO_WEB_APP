services:
  # No mysql service here on purpose - the database is run independently,
  # outside this compose file. Point SPRING_DATASOURCE_URL below at wherever
  # you're running it:
  #   - MySQL on the Windows/WSL host machine (outside Docker): use
  #     host.docker.internal, as set below (Docker Desktop resolves this to
  #     the host automatically, WSL2 backend included).
  #   - MySQL in its own separately-run container: use that container's name
  #     or IP instead, and make sure it's reachable from this compose
  #     project's network (e.g. run it with the same --network, or via a
  #     published port back through the host).
  # Either way, the "todo_mysql_tasos" database itself must already exist
  # before the backend starts - Flyway creates the tables inside it, but
  # not the database itself, unlike the old mysql:8.4 image which did that
  # automatically via MYSQL_DATABASE.

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/todo_mysql_tasos"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "P@ssw0rd"
    expose:
      - "8080"
    # uncomment to reach the API directly (bypassing nginx) while debugging:
    # ports:
    #   - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - backend
      - frontend
